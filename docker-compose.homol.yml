# docker-compose.homol.yml
# Deploy Swarm — Homologação CGE
#
# Uso:
#   docker stack deploy -c docker-compose.homol.yml homolog-jangada --with-registry-auth
#
# Secrets vêm do AWS Secrets Manager (asesi/jangada/homol).
# Credenciais AWS injetadas pelo CI via sed antes do deploy.

version: "3.8"

services:
  jangada:
    image: nexus.cge.ce.gov.br/jangada:homol
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: America/Fortaleza
      AWS_SECRET_NAME: asesi/jangada/homol
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: ${SM_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${SM_AWS_SECRET_ACCESS_KEY}
      ALLOW_LOCAL_BYPASS: "0"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=proxy"
        - "traefik.http.routers.jangada-homol.rule=Host(`homolog-jangada.cge.local`)"
        - "traefik.http.routers.jangada-homol.entrypoints=web"
        - "traefik.http.services.jangada-homol.loadbalancer.server.port=3000"
    # Segurança: container roda sem privilégios extras
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 8s
      start_period: 90s
      retries: 5
    networks:
      - proxy
      - homol

networks:
  proxy:
    external: true
  homol:
    external: true
